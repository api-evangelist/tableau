                    type: string
                    description: The label for the favorite.
                  workbook:
                    $ref: '#/components/schemas/Workbook'
                  view:
                    $ref: '#/components/schemas/View'
                  datasource:
                    $ref: '#/components/schemas/DataSource'
                  project:
                    $ref: '#/components/schemas/Project'

    AddFavoriteRequest:
      type: object
      properties:
        favorite:
