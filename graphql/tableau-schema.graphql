"""The definition (aggregation + time grain) of a Pulse metric."""
type MetricDefinition implements Node {
  id: ID!
  name: String!
  luid: String!
  metricField: Field
  filterFields: [Field!]!
  filterValues: [String!]!
  metric: Metric
}

# ─────────────────────────────────────────────────────────────
# Governance and quality types
# ─────────────────────────────────────────────────────────────

"""A data quality warning attached to a content item."""
type DataQualityWarning implements Node {
  id: ID!
  name: String!
  luid: String!
  warningType: DataQualityWarningType!
  message: String
  isSevere: Boolean!
  isActive: Boolean!
  createdAt: DateTime
  updatedAt: DateTime
  author: TableauUser
  contentId: String
  contentType: ContentType
}

"""A certification note attached to certified content."""
type CertificationNote implements Node {
  id: ID!
  name: String!
  luid: String!
  certificationStatus: CertificationStatus!
  message: String
  author: TableauUser
  createdAt: DateTime
}

"""A tag applied to Tableau content."""
type Tag implements Node {
  id: ID!
  name: String!
  luid: String!
}

"""A permission rule on a content item."""
type Permission implements Node {
  id: ID!
  name: String!
  luid: String!
  granteeType: String
  granteeId: String
  granteeName: String
  capabilityName: String
  capabilityMode: PermissionMode
  contentId: String
  contentType: ContentType
}

"""A content revision entry."""
type Revision implements Node {
  id: ID!
  name: String!
  luid: String!
  revisionNumber: Int
  publishedAt: DateTime
  isDeleted: Boolean
  isCurrent: Boolean
