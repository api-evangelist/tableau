      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/WorkbookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPermissionsRequest'
      responses:
        '200':
          description: Permissions were added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'

  /sites/{site-id}/datasources/{datasource-id}/permissions:
    get:
      operationId: queryDataSourcePermissions
      summary: Query Data Source Permissions
      description: >-
        Returns a list of permissions for the specified data source.
      tags:
        - Permissions
        - Data Sources
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/DataSourceId'
      responses:
        '200':
          description: A list of permissions on the data source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'
    put:
      operationId: addDataSourcePermissions
      summary: Add Data Source Permissions
      description: >-
        Adds permissions to the specified data source for a user or group.
      tags:
        - Permissions
        - Data Sources
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/DataSourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPermissionsRequest'
      responses:
        '200':
          description: Permissions were added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'

  /sites/{site-id}/projects/{project-id}/default-permissions/workbooks:
    get:
      operationId: queryDefaultWorkbookPermissions
      summary: Query Default Permissions for Workbooks
      description: >-
        Returns the default permissions for workbooks in the specified project.
      tags:
        - Permissions
        - Projects
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Default workbook permissions for the project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'

  # ── Schedules ───────────────────────────────────────────────

  /schedules:
    get:
      operationId: querySchedules
      summary: Query Schedules
      description: >-
        Returns a list of extract refresh and subscription schedules.
        This method is available on Tableau Server only.
      tags:
        - Schedules
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: A paginated list of schedules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleListResponse'

  # ── Subscriptions ───────────────────────────────────────────

  /sites/{site-id}/subscriptions:
    get:
      operationId: querySubscriptions
      summary: Query Subscriptions
      description: >-
        Returns a list of all subscriptions on the site.
      tags:
        - Subscriptions
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: A paginated list of subscriptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionListResponse'
    post:
      operationId: createSubscription
      summary: Create Subscription
      description: >-
        Creates a new subscription to a view or workbook for the specified
        user on the specified schedule.
      tags:
        - Subscriptions
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: Subscription was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'

  /sites/{site-id}/subscriptions/{subscription-id}:
    get:
      operationId: querySubscription
      summary: Query Subscription
      description: >-
        Returns information about the specified subscription.
      tags:
        - Subscriptions
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: subscription-id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the subscription.
      responses:
        '200':
          description: Subscription details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
    put:
      operationId: updateSubscription
      summary: Update Subscription
      description: >-
        Modifies an existing subscription, changing the subject, schedule,
        or whether the full workbook or just a single view is sent.
      tags:
        - Subscriptions
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: subscription-id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the subscription to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionRequest'
      responses:
        '200':
          description: Subscription was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
    delete:
      operationId: deleteSubscription
      summary: Delete Subscription
      description: >-
        Deletes the specified subscription from the site.
      tags:
        - Subscriptions
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: subscription-id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the subscription to delete.
      responses:
        '204':
          description: Subscription was deleted successfully.

  # ── Jobs ────────────────────────────────────────────────────

  /sites/{site-id}/jobs:
    get:
      operationId: queryJobs
      summary: Query Jobs
      description: >-
        Returns a list of active jobs on the specified site.
      tags:
        - Jobs
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: A paginated list of background jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'

  /sites/{site-id}/jobs/{job-id}:
    get:
      operationId: queryJob
      summary: Query Job
      description: >-
        Returns status information about the specified job.
      tags:
        - Jobs
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: job-id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the job.
      responses:
        '200':
          description: Job status information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
    put:
      operationId: cancelJob
      summary: Cancel Job
      description: >-
        Cancels the specified background job on a site.
      tags:
        - Jobs
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: job-id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the job to cancel.
      responses:
        '200':
          description: Job was cancelled successfully.

  # ── Favorites ───────────────────────────────────────────────

  /sites/{site-id}/favorites/{user-id}:
    get:
      operationId: getFavorites
      summary: Get Favorites for User
      description: >-
        Returns a list of favorite items for the specified user.
      tags:
        - Favorites
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: A list of the user's favorite items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoritesResponse'
    put:
      operationId: addFavorites
      summary: Add Favorites
      description: >-
        Adds the specified content to a user's favorites. You can add
        workbooks, views, data sources, projects, and flows.
      tags:
        - Favorites
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFavoriteRequest'
      responses:
        '200':
          description: Favorite was added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoritesResponse'

components:

  securitySchemes:
    TableauAuth:
      type: apiKey
      in: header
      name: X-Tableau-Auth
      description: >-
        The authentication token obtained from the Sign In method.
        Include this token in the X-Tableau-Auth header of all
        subsequent requests.

  parameters:
    SiteId:
      name: site-id
      in: path
      required: true
      schema:
        type: string
      description: >-
        The ID of the site. You can get the site ID from the response
        to the Sign In method.

    ProjectId:
      name: project-id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the project.

    WorkbookId:
      name: workbook-id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the workbook.

    ViewId:
      name: view-id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the view.

    DataSourceId:
      name: datasource-id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the data source.

    UserId:
      name: user-id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the user.

    GroupId:
      name: group-id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the group.

    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      description: >-
        The number of items to return in one response. The minimum is 1
        and the maximum is 1000.

    PageNumber:
      name: pageNumber
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: >-
        The page number of the set of items to return. The default is 1.

    Filter:
      name: filter
      in: query
      schema:
        type: string
      description: >-
        An expression that lets you specify a subset of items to return.
        Use the format filter=field:operator:value. Operators include
        eq, gt, gte, lt, lte, has, and in.

    Sort:
      name: sort
      in: query
      schema:
        type: string
      description: >-
        An expression that lets you specify the order in which items
        are returned. Use the format sort=field:direction where direction
        is asc or desc.

    Fields:
      name: fields
      in: query
      schema:
        type: string
      description: >-
        An expression that lets you specify which fields are included
        in the response. Use the format fields=field1,field2. Use
        _default_ to return the default set of fields, or _all_ to
        return all fields.

  responses:
    BadRequest:
      description: >-
        The request was malformed or contained invalid parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: >-
        The authentication credentials were missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: >-
        The caller does not have permission to perform the requested action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: >-
        The specified resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: >-
        A resource with the same name or identifier already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    # ── Error ──────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            summary:
              type: string
              description: A short summary of the error.
            detail:
              type: string
              description: A detailed description of the error.
            code:
              type: string
              description: A numeric error code.

    # ── Pagination ─────────────────────────────────────────────

    Pagination:
      type: object
      properties:
        pageNumber:
          type: integer
          description: The current page number.
        pageSize:
          type: integer
          description: The number of items per page.
        totalAvailable:
          type: integer
          description: The total number of items available.

    # ── Authentication ─────────────────────────────────────────

    SignInRequest:
      type: object
      properties:
        credentials:
          type: object
          required:
            - site
          properties:
            name:
              type: string
              description: >-
                The name (user name) of the user signing in. Not required
                if using a personal access token.
            password:
              type: string
              format: password
              description: The password for the user.
            personalAccessTokenName:
              type: string
              description: >-
                The name of the personal access token. Use this instead
                of name and password for token-based authentication.
            personalAccessTokenSecret:
              type: string
              format: password
              description: The secret value of the personal access token.
            site:
              type: object
              properties:
                contentUrl:
                  type: string
                  description: >-
                    The URL namespace of the site. For the default site
                    on Tableau Server, use an empty string. For Tableau
                    Cloud, this is the site name in the URL.

    SignInResponse:
      type: object
      properties:
        credentials:
          type: object
          properties:
            token:
              type: string
              description: >-
                The authentication token to use in subsequent API calls.
            site:
              type: object
              properties:
                id:
                  type: string
                  description: The ID of the site.
                contentUrl:
                  type: string
                  description: The URL namespace of the site.
            user:
              type: object
              properties:
                id:
                  type: string
                  description: The ID of the authenticated user.

    # ── Site ───────────────────────────────────────────────────

    Site:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the site.
        name:
          type: string
          description: The name of the site.
        contentUrl:
          type: string
          description: The URL namespace for the site.
        adminMode:
          type: string
          enum:
            - ContentAndUsers
            - ContentOnly
          description: The administrator mode for the site.
        state:
          type: string
          enum:
            - Active
            - Suspended
          description: The current state of the site.
        storageQuota:
          type: integer
          description: The storage quota for the site in megabytes.
        userQuota:
          type: integer
          description: >-
            The maximum number of users for the site. A value of -1
            indicates no limit.
        numCreators:
          type: integer
          description: The number of Creator-licensed users on the site.
        numExplorers:
          type: integer
          description: The number of Explorer-licensed users on the site.
        numViewers:
          type: integer
          description: The number of Viewer-licensed users on the site.
        disableSubscriptions:
          type: boolean
          description: Whether subscriptions are disabled on the site.
        revision:
          type: string
          description: The revision number of the site.
        usage:
          type: object
          properties:
            numUsers:
              type: integer
              description: The number of users on the site.
            storage:
              type: integer
              description: The storage used in megabytes.

    SiteListResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        sites:
          type: object
          properties:
            site:
              type: array
              items:
                $ref: '#/components/schemas/Site'

    SiteResponse:
      type: object
      properties:
        site:
          $ref: '#/components/schemas/Site'

    CreateSiteRequest:
      type: object
      properties:
        site:
          type: object
          required:
            - name
            - contentUrl
          properties:
            name:
              type: string
              description: The name of the site.
            contentUrl:
              type: string
              description: The URL namespace for the site.
            adminMode:
              type: string
              enum:
                - ContentAndUsers
                - ContentOnly
            userQuota:
              type: integer
              description: The maximum number of users for the site.
            storageQuota:
              type: integer
              description: The storage quota in megabytes.
            disableSubscriptions:
              type: boolean

    UpdateSiteRequest:
      type: object
      properties:
        site:
          type: object
          properties:
            name:
              type: string
            contentUrl:
              type: string
            adminMode:
              type: string
              enum:
                - ContentAndUsers
                - ContentOnly
            state:
              type: string
              enum:
                - Active
                - Suspended
            storageQuota:
              type: integer
            userQuota:
              type: integer
            disableSubscriptions:
              type: boolean
            revision:
              type: string

    # ── Project ────────────────────────────────────────────────

    Project:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the project.
        name:
          type: string
          description: The name of the project.
        description:
          type: string
          description: A description of the project.
        parentProjectId:
          type: ['string', 'null']
          description: >-
            The ID of the parent project. If null, this is a top-level project.
        contentPermissions:
          type: string
          enum:
            - LockedToProject
            - ManagedByOwner
            - LockedToProjectWithoutNested
          description: The permissions model for the project.
        createdAt:
          type: string
          format: date-time
          description: The date and time the project was created.
        updatedAt:
          type: string
          format: date-time
          description: The date and time the project was last updated.
        owner:
          type: object
          properties:
            id:
              type: string
              description: The ID of the project owner.
        topLevelProject:
          type: boolean
          description: Whether this is a top-level project.

    ProjectListResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        projects:
          type: object
          properties:
            project:
              type: array
              items:
                $ref: '#/components/schemas/Project'

    ProjectResponse:
      type: object
      properties:
        project:
          $ref: '#/components/schemas/Project'

    CreateProjectRequest:
      type: object
      properties:
        project:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              description: The name for the project.
            description:
              type: string
              description: A description for the project.
            parentProjectId:
              type: string
              description: >-
                The ID of the parent project. Omit for a top-level project.
            contentPermissions:
              type: string
              enum:
                - LockedToProject
                - ManagedByOwner
                - LockedToProjectWithoutNested

    UpdateProjectRequest:
      type: object
      properties:
        project:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
            parentProjectId:
              type: string
            contentPermissions:
              type: string
              enum:
                - LockedToProject
                - ManagedByOwner
                - LockedToProjectWithoutNested

    # ── Workbook ───────────────────────────────────────────────

    Workbook:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the workbook.
        name:
          type: string
          description: The name of the workbook.
        description:
          type: string
          description: A description of the workbook.
        contentUrl:
          type: string
          description: >-
            The URL name of the workbook, used in URLs to access the workbook.
        webpageUrl:
          type: string
          format: uri
          description: The full URL to the workbook on the server.
        showTabs:
          type: boolean
          description: Whether the workbook shows views as tabs.
        size:
          type: integer
          description: The size of the workbook in bytes.
        createdAt:
          type: string
          format: date-time
          description: The date and time the workbook was created.
        updatedAt:
          type: string
          format: date-time
          description: The date and time the workbook was last updated.
        encryptExtracts:
          type: string
          description: Whether extracts in the workbook are encrypted.
        defaultViewId:
          type: string
          description: The ID of the default view in the workbook.
        project:
          type: object
          properties:
            id:
              type: string
              description: The ID of the containing project.
            name:
              type: string
              description: The name of the containing project.
        owner:
          type: object
          properties:
            id:
              type: string
              description: The ID of the workbook owner.
            name:
              type: string
              description: The name of the workbook owner.
        tags:
          type: object
          properties:
            tag:
              type: array
              items:
                $ref: '#/components/schemas/Tag'
        views:
          type: object
          properties:
            view:
              type: array
              items:
                $ref: '#/components/schemas/View'
        usage:
          type: object
          properties:
            totalViewCount:
              type: integer
              description: The total number of times the workbook has been viewed.

    WorkbookListResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        workbooks:
          type: object
          properties:
            workbook:
              type: array
              items:
                $ref: '#/components/schemas/Workbook'

    WorkbookResponse:
      type: object
      properties:
        workbook:
          $ref: '#/components/schemas/Workbook'

    UpdateWorkbookRequest:
      type: object
      properties:
        workbook:
          type: object
          properties:
            name:
              type: string
            showTabs:
              type: boolean
            project:
              type: object
              properties:
                id:
                  type: string
            owner:
              type: object
              properties:
                id:
                  type: string
            encryptExtracts:
              type: string

    PublishWorkbookRequest:
      type: object
      properties:
        workbook:
          type: object
          required:
            - name
            - project
          properties:
            name:
              type: string
              description: The name of the workbook.
            description:
              type: string
              description: A description of the workbook.
            showTabs:
              type: boolean
              description: Whether to show views as tabs.
            project:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: The ID of the project to publish to.
            connections:
              type: object
              properties:
                connection:
                  type: array
                  items:
                    type: object
                    properties:
                      serverAddress:
                        type: string
                      serverPort:
                        type: string
                      credentials:
                        type: object
                        properties:
                          name:
                            type: string
                          password:
                            type: string
                            format: password
                          embed:
                            type: boolean

    # ── View ───────────────────────────────────────────────────

    View:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the view.
        name:
          type: string
          description: The name of the view.
        contentUrl:
          type: string
          description: The URL name of the view.
        createdAt:
          type: string
          format: date-time
          description: The date and time the view was created.
        updatedAt:
          type: string
          format: date-time
          description: The date and time the view was last updated.
        viewUrlName:
          type: string
          description: >-
            The URL-friendly name of the view used in the content URL.
        sheetType:
          type: string
          enum:
            - worksheet
            - dashboard
            - story
          description: The type of sheet (worksheet, dashboard, or story).
        project:
          type: object
          properties:
            id:
              type: string
              description: The ID of the containing project.
            name:
              type: string
              description: The name of the containing project.
        owner:
          type: object
          properties:
            id:
              type: string
              description: The ID of the view owner.
            name:
              type: string
              description: The name of the view owner.
        workbook:
          type: object
          properties:
            id:
              type: string
              description: The ID of the containing workbook.
            name:
              type: string
              description: The name of the containing workbook.
        tags:
          type: object
          properties:
            tag:
              type: array
              items:
                $ref: '#/components/schemas/Tag'
        usage:
          type: object
          properties:
            totalViewCount:
              type: integer
              description: The total number of times the view has been accessed.

    ViewListResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        views:
          type: object
          properties:
            view:
              type: array
              items:
                $ref: '#/components/schemas/View'

    ViewResponse:
      type: object
      properties:
        view:
          $ref: '#/components/schemas/View'

    # ── Data Source ─────────────────────────────────────────────

    DataSource:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the data source.
        name:
          type: string
          description: The name of the data source.
        description:
          type: string
          description: A description of the data source.
        contentUrl:
          type: string
          description: The URL name of the data source.
        type:
          type: string
          description: >-
            The type of data source (e.g., sqlserver, postgres, excel,
            hyper, etc.).
        createdAt:
          type: string
          format: date-time
          description: The date and time the data source was created.
        updatedAt:
          type: string
          format: date-time
          description: The date and time the data source was last updated.
        isCertified:
          type: boolean
          description: Whether the data source is certified.
        certificationNote:
          type: string
          description: The certification note for the data source.
        useRemoteQueryAgent:
          type: boolean
          description: Whether the data source uses a remote query agent.
        hasExtracts:
          type: boolean
          description: Whether the data source has extracts.
        encryptExtracts:
          type: string
          description: Whether the data source extracts are encrypted.
        project:
          type: object
          properties:
            id:
              type: string
              description: The ID of the containing project.
            name:
              type: string
              description: The name of the containing project.
        owner:
          type: object
          properties:
            id:
              type: string
              description: The ID of the data source owner.
            name:
              type: string
              description: The name of the data source owner.
        tags:
          type: object
          properties:
            tag:
              type: array
              items:
                $ref: '#/components/schemas/Tag'

    DataSourceListResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        datasources:
          type: object
          properties:
            datasource:
              type: array
              items:
                $ref: '#/components/schemas/DataSource'

    DataSourceResponse:
      type: object
      properties:
        datasource:
          $ref: '#/components/schemas/DataSource'

    UpdateDataSourceRequest:
      type: object
      properties:
        datasource:
          type: object
          properties:
            name:
              type: string
            project:
              type: object
              properties:
                id:
                  type: string
            owner:
              type: object
              properties:
                id:
                  type: string
            isCertified:
              type: boolean
            certificationNote:
              type: string
            encryptExtracts:
              type: string

    # ── Connection ─────────────────────────────────────────────

    Connection:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the connection.
        type:
          type: string
          description: The type of connection (e.g., sqlserver, postgres).
        serverAddress:
          type: string
          description: The address of the server for the connection.
        serverPort:
          type: string
          description: The port used for the connection.
        userName:
          type: string
          description: The user name for the connection.
        datasource:
          type: object
          properties:
            id:
              type: string
              description: The ID of the associated data source.
            name:
              type: string
              description: The name of the associated data source.

    ConnectionListResponse:
      type: object
      properties:
        connections:
          type: object
          properties:
            connection:
              type: array
              items:
                $ref: '#/components/schemas/Connection'

    # ── User ───────────────────────────────────────────────────

    User:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the user.
        name:
          type: string
          description: The name (user name) of the user.
        fullName:
          type: string
          description: The display name of the user.
        email:
          type: string
          format: email
          description: The email address of the user.
        siteRole:
          type: string
          enum:
            - Creator
            - Explorer
            - ExplorerCanPublish
            - SiteAdministratorCreator
            - SiteAdministratorExplorer
            - Unlicensed
            - Viewer
          description: The role of the user on the site.
        authSetting:
          type: string
          description: The authentication type for the user.
        lastLogin:
          type: string
          format: date-time
          description: The date and time of the user's last login.
        externalAuthUserId:
          type: string
          description: The external authentication user ID.
        locale:
          type: string
          description: The user's locale setting.
        language:
          type: string
          description: The user's language setting.

    UserListResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        users:
          type: object
          properties:
            user:
              type: array
              items:
                $ref: '#/components/schemas/User'

    UserResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'

    AddUserRequest:
      type: object
      properties:
        user:
          type: object
          required:
            - name
            - siteRole
          properties:
            name:
              type: string
              description: The name of the user to add.
            siteRole:
              type: string
              enum:
                - Creator
                - Explorer
                - ExplorerCanPublish
                - SiteAdministratorCreator
                - SiteAdministratorExplorer
                - Unlicensed
                - Viewer
            authSetting:
              type: string
              description: The authentication type for the user.

    UpdateUserRequest:
      type: object
      properties:
        user:
          type: object
          properties:
            fullName:
              type: string
            email:
              type: string
              format: email
            siteRole:
              type: string
              enum:
                - Creator
                - Explorer
                - ExplorerCanPublish
                - SiteAdministratorCreator
                - SiteAdministratorExplorer
                - Unlicensed
                - Viewer
            authSetting:
              type: string

    # ── Group ──────────────────────────────────────────────────

    Group:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the group.
        name:
          type: string
          description: The name of the group.
        domainName:
          type: string
          description: >-
            The domain name for Active Directory groups. For local
            groups, this is "local".
        minimumSiteRole:
          type: string
          enum:
            - Creator
            - Explorer
            - ExplorerCanPublish
            - SiteAdministratorCreator
            - SiteAdministratorExplorer
            - Unlicensed
            - Viewer
          description: >-
            The minimum site role for members of the group when they
            are imported from Active Directory.
        userCount:
          type: integer
          description: The number of users in the group.
        import:
          type: object
          properties:
            domainName:
              type: string
            siteRole:
              type: string
            grantLicenseMode:
              type: string

    GroupListResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        groups:
          type: object
          properties:
            group:
              type: array
              items:
                $ref: '#/components/schemas/Group'

    GroupResponse:
      type: object
      properties:
        group:
          $ref: '#/components/schemas/Group'

    CreateGroupRequest:
      type: object
      properties:
        group:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              description: The name of the group.
            minimumSiteRole:
              type: string
              enum:
                - Creator
                - Explorer
                - ExplorerCanPublish
                - SiteAdministratorCreator
                - SiteAdministratorExplorer
                - Unlicensed
                - Viewer

    UpdateGroupRequest:
      type: object
      properties:
        group:
          type: object
          properties:
            name:
              type: string
            minimumSiteRole:
              type: string
              enum:
                - Creator
                - Explorer
                - ExplorerCanPublish
                - SiteAdministratorCreator
                - SiteAdministratorExplorer
                - Unlicensed
                - Viewer

    # ── Tag ────────────────────────────────────────────────────

    Tag:
      type: object
      properties:
        label:
          type: string
          description: The text of the tag.

    TagListResponse:
      type: object
      properties:
        tags:
          type: object
          properties:
            tag:
              type: array
              items:
                $ref: '#/components/schemas/Tag'

    TagListRequest:
      type: object
      properties:
        tags:
          type: object
          properties:
            tag:
              type: array
              items:
                $ref: '#/components/schemas/Tag'

    # ── Revision ───────────────────────────────────────────────

    Revision:
      type: object
      properties:
        revisionNumber:
          type: integer
          description: The revision number.
        publishedAt:
          type: string
          format: date-time
          description: The date and time the revision was published.
        deleted:
          type: boolean
          description: Whether this revision has been deleted.
        current:
          type: boolean
          description: Whether this is the current revision.
        sizeInBytes:
          type: integer
          description: The size of the revision in bytes.
        publisher:
          type: object
          properties:
            id:
              type: string
              description: The ID of the user who published this revision.
            name:
              type: string
              description: The name of the user who published this revision.

    RevisionListResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        revisions:
          type: object
          properties:
            revision:
              type: array
              items:
                $ref: '#/components/schemas/Revision'

    # ── Permissions ────────────────────────────────────────────

    Permission:
      type: object
      properties:
        granteeCapabilities:
          type: array
          items:
            type: object
            properties:
              user:
                type: object
                properties:
                  id:
                    type: string
              group:
                type: object
                properties:
                  id:
                    type: string
              capabilities:
                type: object
                properties:
                  capability:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: >-
                            The name of the capability (e.g., Read, Write,
                            ChangePermissions, Delete, Filter,
                            ViewComments, AddComment, ExportData,
                            ExportImage, ShareView, ViewUnderlyingData,
                            WebAuthoring, RunExplainData).
                        mode:
                          type: string
                          enum:
                            - Allow
                            - Deny
                          description: >-
                            Whether the capability is allowed or denied.

    PermissionListResponse:
      type: object
      properties:
        permissions:
          $ref: '#/components/schemas/Permission'
        parent:
          type: object
          properties:
            project:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string

    AddPermissionsRequest:
      type: object
      properties:
        permissions:
          $ref: '#/components/schemas/Permission'

    # ── Schedule ───────────────────────────────────────────────

    Schedule:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the schedule.
        name:
          type: string
          description: The name of the schedule.
        state:
          type: string
          enum:
            - Active
            - Suspended
          description: Whether the schedule is active or suspended.
        priority:
          type: integer
          minimum: 1
          maximum: 100
          description: >-
            The priority of the schedule (1-100). Lower numbers indicate
            higher priority.
        createdAt:
          type: string
          format: date-time
          description: The date and time the schedule was created.
        updatedAt:
          type: string
          format: date-time
          description: The date and time the schedule was last updated.
        type:
          type: string
          enum:
            - Extract
            - Subscription
            - Flow
          description: The type of the schedule.
        frequency:
          type: string
          enum:
            - Hourly
            - Daily
            - Weekly
            - Monthly
          description: How frequently the schedule runs.
        nextRunAt:
          type: string
          format: date-time
          description: The next scheduled run time.
        endScheduleAt:
          type: string
          format: date-time
          description: The time when the schedule ends.
        frequencyDetails:
          type: object
          properties:
            start:
              type: string
              description: The start time (HH:MM:SS).
            end:
              type: string
              description: The end time (HH:MM:SS).
            intervals:
              type: object
              properties:
                interval:
                  type: array
                  items:
                    type: object
                    properties:
                      hours:
                        type: string
                      minutes:
                        type: string
                      weekDay:
                        type: string
                      monthDay:
                        type: string

    ScheduleListResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        schedules:
          type: object
          properties:
            schedule:
              type: array
              items:
                $ref: '#/components/schemas/Schedule'

    # ── Subscription ───────────────────────────────────────────

    Subscription:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the subscription.
        subject:
          type: string
          description: The subject line of the subscription email.
        attachImage:
          type: boolean
          description: Whether to attach an image of the view.
        attachPdf:
          type: boolean
          description: Whether to attach a PDF of the view.
        message:
          type: string
          description: Custom message for the subscription.
        pageOrientation:
          type: string
          enum:
            - portrait
            - landscape
        pageSizeOption:
          type: string
          enum:
            - A3
            - A4
            - A5
            - B4
            - B5
            - Executive
            - Folio
            - Ledger
            - Legal
            - Letter
            - Note
            - Quarto
            - Tabloid
            - Unspecified
        suspended:
          type: boolean
          description: Whether the subscription is suspended.
        content:
          type: object
          properties:
            id:
              type: string
              description: The ID of the subscribed content.
            type:
              type: string
              enum:
                - Workbook
                - View
              description: The type of the subscribed content.
        schedule:
          type: object
          properties:
            id:
              type: string
              description: The ID of the schedule.
            name:
              type: string
              description: The name of the schedule.
        user:
          type: object
          properties:
            id:
              type: string
              description: The ID of the subscriber.
            name:
              type: string
              description: The name of the subscriber.

    SubscriptionListResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        subscriptions:
          type: object
          properties:
            subscription:
              type: array
              items:
                $ref: '#/components/schemas/Subscription'

    SubscriptionResponse:
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/Subscription'

    CreateSubscriptionRequest:
      type: object
      properties:
        subscription:
          type: object
          required:
            - subject
            - content
            - schedule
            - user
          properties:
            subject:
              type: string
            content:
              type: object
              required:
                - id
                - type
              properties:
                id:
                  type: string
                type:
                  type: string
                  enum:
                    - Workbook
                    - View
            schedule:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
            user:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
            attachImage:
              type: boolean
            attachPdf:
              type: boolean
            message:
              type: string

    UpdateSubscriptionRequest:
      type: object
      properties:
        subscription:
          type: object
          properties:
            subject:
              type: string
            schedule:
              type: object
              properties:
                id:
                  type: string
            suspended:
              type: boolean

    # ── Job ────────────────────────────────────────────────────

    Job:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the job.
        mode:
          type: string
          description: The mode of the job.
        type:
          type: string
          description: The type of the job.
        status:
          type: integer
          description: >-
            The status code of the job. 0 = Active/Queued,
            1 = Complete, 2 = Cancelled.
        progress:
          type: integer
          description: The progress of the job as a percentage.
        createdAt:
          type: string
          format: date-time
          description: The date and time the job was created.
        startedAt:
          type: string
          format: date-time
          description: The date and time the job started running.
        endedAt:
          type: string
          format: date-time
          description: The date and time the job finished.
        finishCode:
          type: integer
          description: The completion code. 0 = success, 1 = error, 2 = cancelled.
        title:
          type: string
          description: A description of what the job is doing.
        subtitle:
          type: string
          description: Additional detail about the job.
        statusNotes:
          type: object
          properties:
            statusNote:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  value:
                    type: string
                  text:
                    type: string
        extractRefreshJob:
          type: object
          properties:
            datasource:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
            workbook:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string

    JobListResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        backgroundJobs:
          type: object
          properties:
            backgroundJob:
              type: array
              items:
                $ref: '#/components/schemas/Job'

    JobResponse:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/Job'

