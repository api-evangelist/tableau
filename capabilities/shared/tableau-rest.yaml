naftiko: "1.0.0-alpha1"

info:
  label: "Tableau REST API"
  description: "The Tableau REST API allows you to manage and change Tableau Server and Tableau Cloud resources programmatically using HTTP."
  tags:
    - Tableau
    - Analytics
    - Business Intelligence
    - Data Visualization
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      TABLEAU_AUTH_TOKEN: TABLEAU_AUTH_TOKEN

capability:
  consumes:
    - type: http
      namespace: tableau-rest
      baseUri: https://10ax.online.tableau.com/api/3.24
      description: "Tableau REST API for managing server and cloud resources."
      authentication:
        type: apikey
        key: X-Tableau-Auth
        value: "{{TABLEAU_AUTH_TOKEN}}"
        placement: header
      resources:
        - name: authentication
          path: /auth
          description: "Authentication operations."
          operations:
            - name: sign-in
              method: POST
              description: "Signs in to Tableau Server or Tableau Cloud."
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  credentials: "{{tools.credentials}}"
            - name: sign-out
              method: POST
              description: "Signs out from the server or site."
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: sites
          path: /sites
          description: "Site management operations."
          operations:
            - name: query-sites
              method: GET
              description: "Returns a list of the sites on the server."
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-site
              method: POST
              description: "Creates a site on Tableau Server."
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  site: "{{tools.site}}"
            - name: query-site
              method: GET
              description: "Returns information about the specified site."
              inputParameters:
                - name: siteId
                  in: path
                  type: string
                  required: true
                  description: "The ID of the site."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-site
              method: PUT
              description: "Updates a site."
              inputParameters:
                - name: siteId
                  in: path
                  type: string
                  required: true
                  description: "The ID of the site."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  site: "{{tools.site}}"
            - name: delete-site
              method: DELETE
              description: "Deletes the specified site."
              inputParameters:
                - name: siteId
                  in: path
                  type: string
                  required: true
                  description: "The ID of the site."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: workbooks
          path: /sites/{siteId}/workbooks
          description: "Workbook management operations."
          operations:
            - name: query-workbooks
              method: GET
              description: "Returns the workbooks on a site."
              inputParameters:
                - name: siteId
                  in: path
                  type: string
                  required: true
                  description: "The ID of the site."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: query-workbook
              method: GET
              description: "Returns information about the specified workbook."
              inputParameters:
                - name: siteId
                  in: path
                  type: string
                  required: true
                  description: "The ID of the site."
                - name: workbookId
                  in: path
                  type: string
                  required: true
                  description: "The ID of the workbook."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-workbook
              method: DELETE
              description: "Deletes a workbook."
              inputParameters:
                - name: siteId
                  in: path
                  type: string
                  required: true
                  description: "The ID of the site."
                - name: workbookId
                  in: path
                  type: string
                  required: true
                  description: "The ID of the workbook."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: data-sources
          path: /sites/{siteId}/datasources
          description: "Data source management operations."
          operations:
            - name: query-data-sources
              method: GET
              description: "Returns the data sources on a site."
              inputParameters:
                - name: siteId
                  in: path
                  type: string
                  required: true
                  description: "The ID of the site."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: query-data-source
              method: GET
              description: "Returns information about the specified data source."
              inputParameters:
                - name: siteId
                  in: path
                  type: string
                  required: true
                  description: "The ID of the site."
                - name: datasourceId
                  in: path
                  type: string
                  required: true
                  description: "The ID of the data source."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-data-source
              method: DELETE
              description: "Deletes a data source."
              inputParameters:
                - name: siteId
                  in: path
                  type: string
                  required: true
                  description: "The ID of the site."
                - name: datasourceId
                  in: path
                  type: string
                  required: true
                  description: "The ID of the data source."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: users
          path: /sites/{siteId}/users
          description: "User management operations."
          operations:
            - name: get-users
              method: GET
              description: "Gets the users on a site."
              inputParameters:
                - name: siteId
                  in: path
                  type: string
                  required: true
                  description: "The ID of the site."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: add-user
              method: POST
              description: "Adds a user to a site."
              inputParameters:
                - name: siteId
                  in: path
                  type: string
                  required: true
                  description: "The ID of the site."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  user: "{{tools.user}}"

  exposes:
    - type: rest
      port: 8100
      namespace: tableau-rest-api
      resources:
        - path: /v1/sites
          name: sites
          description: "Site management"
          operations:
            - method: GET
              name: query-sites
              description: "List all sites"
              call: "tableau-rest.query-sites"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: tableau-rest-mcp
      transport: http
      tools:
        - name: sign-in
          description: "Sign in to Tableau"
          hints:
            readOnly: false
            idempotent: false
          call: "tableau-rest.sign-in"
          outputParameters:
            - type: object
              mapping: "$."
        - name: query-sites
          description: "List all sites"
          hints:
            readOnly: true
            idempotent: true
          call: "tableau-rest.query-sites"
          outputParameters:
            - type: object
              mapping: "$."
        - name: query-workbooks
          description: "List workbooks on a site"
          hints:
            readOnly: true
            idempotent: true
          call: "tableau-rest.query-workbooks"
          with:
            siteId: "tools.siteId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: query-data-sources
          description: "List data sources on a site"
          hints:
            readOnly: true
            idempotent: true
          call: "tableau-rest.query-data-sources"
          with:
            siteId: "tools.siteId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-users
          description: "List users on a site"
          hints:
            readOnly: true
            idempotent: true
          call: "tableau-rest.get-users"
          with:
            siteId: "tools.siteId"
          outputParameters:
            - type: object
              mapping: "$."
