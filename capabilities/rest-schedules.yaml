naftiko: 1.0.0-alpha2
info:
  label: Tableau REST API — Schedules
  description: 'Tableau REST API — Schedules. 1 operations. Lead operation: Tableau Query Schedules. Self-contained Naftiko
    capability covering one Tableau business surface.'
  tags:
  - Tableau
  - Schedules
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TABLEAU_API_KEY: TABLEAU_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-schedules
    baseUri: https://{server}/api/{api-version}
    description: Tableau REST API — Schedules business capability. Self-contained, no shared references.
    resources:
    - name: schedules
      path: /schedules
      operations:
      - name: queryschedules
        method: GET
        description: Tableau Query Schedules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Tableau-Auth
      value: '{{env.TABLEAU_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: rest-schedules-rest
    port: 8080
    description: REST adapter for Tableau REST API — Schedules. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/schedules
      name: schedules
      description: REST surface for schedules.
      operations:
      - method: GET
        name: queryschedules
        description: Tableau Query Schedules
        call: rest-schedules.queryschedules
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-schedules-mcp
    port: 9090
    transport: http
    description: MCP adapter for Tableau REST API — Schedules. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: tableau-query-schedules
      description: Tableau Query Schedules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-schedules.queryschedules
      outputParameters:
      - type: object
        mapping: $.
