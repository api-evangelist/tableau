      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A paginated list of groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
    post:
      operationId: createGroup
      summary: Create Group
      description: >-
        Creates a group on the specified site.
      tags:
        - Groups
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'

  /sites/{site-id}/groups/{group-id}:
    put:
      operationId: updateGroup
      summary: Update Group
      description: >-
        Updates the name or Active Directory configuration of the
        specified group.
      tags:
        - Groups
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Group was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
    delete:
      operationId: deleteGroup
      summary: Delete Group
      description: >-
        Deletes the specified group from the site.
      tags:
        - Groups
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/GroupId'
      responses:
        '204':
          description: Group was deleted successfully.

  /sites/{site-id}/groups/{group-id}/users:
    get:
      operationId: getGroupMembers
      summary: Get Group Members
      description: >-
        Returns a list of users who are members of the specified group.
      tags:
        - Groups
        - Users
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: A list of users in the group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
    post:
      operationId: addUserToGroup
      summary: Add User to Group
      description: >-
        Adds a user to the specified group.
      tags:
        - Groups
        - Users
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    id:
                      type: string
                      description: The ID of the user to add to the group.
      responses:
        '200':
          description: User was added to the group successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /sites/{site-id}/groups/{group-id}/users/{user-id}:
    delete:
      operationId: removeUserFromGroup
      summary: Remove User from Group
      description: >-
        Removes the specified user from the specified group.
      tags:
        - Groups
        - Users
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: User was removed from the group successfully.

  # ── Permissions ─────────────────────────────────────────────

  /sites/{site-id}/workbooks/{workbook-id}/permissions:
