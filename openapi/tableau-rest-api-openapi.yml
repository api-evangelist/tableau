openapi: 3.1.0
info:
  version: 3.24.0
  title: Tableau REST API
  description: >-
    The Tableau REST API allows you to manage and change Tableau Server
    and Tableau Cloud resources programmatically using HTTP. You can use
    the REST API to manage sites, projects, workbooks, views, data sources,
    users, groups, permissions, schedules, subscriptions, and more.
  license:
    name: Proprietary
    url: https://www.tableau.com/legal
  termsOfService: https://www.tableau.com/legal
  contact:
    name: Tableau Developer Support
    url: https://www.tableau.com/support

servers:
  - url: https://{server}/api/{api-version}
    description: Tableau Server or Tableau Cloud
    variables:
      server:
        default: 10ax.online.tableau.com
        description: >-
          The hostname of your Tableau Server or Tableau Cloud site.
          For Tableau Cloud, use the pod URL (e.g., 10ax.online.tableau.com).
          For Tableau Server, use your server hostname.
      api-version:
        default: '3.24'
        description: >-
          The version of the REST API to use. The API version corresponds
          to the version of Tableau Server or Tableau Cloud.
        enum:
          - '3.24'
          - '3.23'
          - '3.22'
          - '3.21'
          - '3.20'
          - '3.19'

externalDocs:
  description: Tableau REST API Reference
  url: https://help.tableau.com/current/api/rest_api/en-us/REST/rest_api_ref.htm

tags:
  - name: Authentication
    description: >-
      Sign in and sign out of Tableau Server or Tableau Cloud. You must
      sign in to obtain an authentication token before calling other methods.
  - name: Sites
    description: >-
      Manage sites on Tableau Server. A site is a collection of users,
      groups, projects, workbooks, data sources, and other resources.
  - name: Projects
    description: >-
      Create, update, delete, and query projects. Projects are containers
      for organizing workbooks, data sources, and other content on a site.
  - name: Workbooks
    description: >-
      Publish, query, update, delete, and download workbooks. Workbooks
      contain one or more views (sheets, dashboards, or stories) and can
      connect to one or more data sources.
  - name: Views
    description: >-
      Query views and download view images or data. Views are the
      individual sheets, dashboards, or stories within a workbook.
  - name: Data Sources
    description: >-
      Publish, query, update, delete, and download data sources. Data
      sources define the connection to data and can be shared across
      multiple workbooks.
  - name: Users
    description: >-
      Add, update, remove, and query users on a site. Users are
      individuals who can sign in to Tableau Server or Tableau Cloud.
  - name: Groups
    description: >-
      Create, update, delete, and query groups. Groups are collections
      of users that simplify permission management.
  - name: Permissions
    description: >-
      Query and set permissions on content items including workbooks,
      data sources, projects, views, and flows.
  - name: Schedules
    description: >-
      Create, update, delete, and query schedules for extract refreshes
      and subscriptions on Tableau Server.
  - name: Subscriptions
    description: >-
      Create, update, delete, and query subscriptions. Subscriptions
      deliver snapshots of views to users on a schedule.
  - name: Jobs
    description: >-
      Query and cancel background jobs on a site, including extract
      refreshes, subscriptions, and flow runs.
  - name: Favorites
    description: >-
      Add and remove content items from a user's list of favorites,
      including workbooks, views, data sources, projects, and flows.

security:
  - TableauAuth: []

paths:

  # ── Authentication ──────────────────────────────────────────

  /auth/signin:
    post:
      operationId: signIn
      summary: Sign In
      description: >-
        Signs you in as a user on the specified site on Tableau Server or
        Tableau Cloud. This call returns an authentication token that you
        use in subsequent calls to the server. Typically, a credentials
        token is valid for 240 minutes.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Successfully signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/signout:
    post:
      operationId: signOut
      summary: Sign Out
      description: >-
        Signs you out of the current session. This invalidates the
        authentication token.
      tags:
        - Authentication
      responses:
        '204':
          description: Successfully signed out.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/switchSite:
    post:
      operationId: switchSite
      summary: Switch Site
      description: >-
        Switches you to the specified site without having to provide a
        user name and password again. The new site must be on the same
        server.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                site:
                  type: object
                  properties:
                    contentUrl:
                      type: string
                      description: The URL namespace of the site to switch to.
      responses:
        '200':
          description: Successfully switched to the specified site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'

  # ── Sites ───────────────────────────────────────────────────

  /sites:
    get:
      operationId: querySites
      summary: Query Sites
      description: >-
        Returns a list of the sites on the server that the caller has
        access to. This method is available to Tableau Server administrators.
      tags:
        - Sites
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: A paginated list of sites.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createSite
      summary: Create Site
      description: >-
        Creates a site on Tableau Server. To create a site, you must be
        a server administrator. Not available for Tableau Cloud.
      tags:
        - Sites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
      responses:
        '201':
          description: Site was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /sites/{site-id}:
    get:
      operationId: querySite
      summary: Query Site
      description: >-
        Returns information about the specified site, with the option to
        return information about the storage space and the number of users.
      tags:
        - Sites
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: includeUsageStatistics
          in: query
          schema:
            type: boolean
            default: false
          description: If true, returns usage statistics for the site.
      responses:
        '200':
          description: Site details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateSite
      summary: Update Site
      description: >-
        Updates the settings for the specified site, including the name,
        URL namespace, storage quota, and other settings.
      tags:
        - Sites
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteRequest'
      responses:
        '200':
          description: Site was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteSite
      summary: Delete Site
      description: >-
        Deletes the specified site. Deleting a site also deletes all
        content on the site including workbooks, data sources, users, etc.
      tags:
        - Sites
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '204':
          description: Site was deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Projects ────────────────────────────────────────────────

  /sites/{site-id}/projects:
    get:
      operationId: queryProjects
      summary: Query Projects
      description: >-
        Returns a list of projects on the specified site, with optional
        pagination. You can filter and sort the list of projects.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A paginated list of projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createProject
      summary: Create Project
      description: >-
        Creates a project on the specified site. You can also create
        project hierarchies by setting a parent project.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /sites/{site-id}/projects/{project-id}:
    put:
      operationId: updateProject
      summary: Update Project
      description: >-
        Updates the name, description, or project hierarchy of the specified project.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteProject
      summary: Delete Project
      description: >-
        Deletes the specified project on a site. When you delete a
        project, all Tableau assets inside the project are also deleted.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '204':
          description: Project was deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Workbooks ───────────────────────────────────────────────

  /sites/{site-id}/workbooks:
    get:
      operationId: queryWorkbooksForSite
      summary: Query Workbooks for Site
      description: >-
        Returns the workbooks on a site. If the user is not an
        administrator, the method returns just the workbooks that the
        user has permissions to view.
      tags:
        - Workbooks
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: A paginated list of workbooks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbookListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sites/{site-id}/workbooks/{workbook-id}:
    get:
      operationId: queryWorkbook
      summary: Query Workbook
      description: >-
        Returns information about the specified workbook, including
        information about views and tags.
      tags:
        - Workbooks
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/WorkbookId'
      responses:
        '200':
          description: Workbook details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateWorkbook
      summary: Update Workbook
      description: >-
        Modifies an existing workbook, allowing you to change the owner,
        project, or other properties.
      tags:
        - Workbooks
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/WorkbookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkbookRequest'
      responses:
        '200':
          description: Workbook was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteWorkbook
      summary: Delete Workbook
      description: >-
        Deletes a workbook. When a workbook is deleted, all of its assets
        are also deleted, including associated views.
      tags:
        - Workbooks
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/WorkbookId'
      responses:
        '204':
          description: Workbook was deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{site-id}/workbooks/{workbook-id}/connections:
    get:
      operationId: queryWorkbookConnections
      summary: Query Workbook Connections
      description: >-
        Returns a list of data connections for the specified workbook.
      tags:
        - Workbooks
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/WorkbookId'
      responses:
        '200':
          description: A list of data connections for the workbook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{site-id}/workbooks/{workbook-id}/content:
    get:
      operationId: downloadWorkbook
      summary: Download Workbook
      description: >-
        Downloads a workbook in .twb or .twbx format. If the workbook
        contains extracts, the download is in .twbx format.
      tags:
        - Workbooks
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/WorkbookId'
        - name: extractValue
          in: query
          schema:
            type: boolean
            default: true
          description: >-
            If true, and the workbook contains extracts, the download
            includes the extracts.
      responses:
        '200':
          description: The workbook file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{site-id}/workbooks/{workbook-id}/previewImage:
    get:
      operationId: queryWorkbookPreviewImage
      summary: Query Workbook Preview Image
      description: >-
        Returns the thumbnail image for the specified workbook as a
        PNG file.
      tags:
        - Workbooks
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/WorkbookId'
      responses:
        '200':
          description: A PNG preview image of the workbook.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{site-id}/workbooks/{workbook-id}/views:
    get:
      operationId: queryViewsForWorkbook
      summary: Query Views for Workbook
      description: >-
        Returns all the views for the specified workbook, optionally
        including usage statistics.
      tags:
        - Workbooks
        - Views
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/WorkbookId'
        - name: includeUsageStatistics
          in: query
          schema:
            type: boolean
            default: false
          description: If true, returns usage statistics for each view.
      responses:
        '200':
          description: A list of views for the workbook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{site-id}/workbooks/{workbook-id}/publish:
    post:
      operationId: publishWorkbook
      summary: Publish Workbook
      description: >-
        Publishes a workbook on the specified site. To make changes
        to an existing workbook, call Update Workbook or Publish
        Workbook with overwrite set to true.
      tags:
        - Workbooks
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: overwrite
          in: query
          schema:
            type: boolean
            default: false
          description: >-
            If true, overwrites an existing workbook with the same name
            in the same project.
        - name: skipConnectionCheck
          in: query
          schema:
            type: boolean
            default: false
          description: If true, skips the connection check during publish.
      requestBody:
        required: true
        content:
          multipart/mixed:
            schema:
              type: object
              properties:
                request_payload:
                  $ref: '#/components/schemas/PublishWorkbookRequest'
                tableau_workbook:
                  type: string
                  format: binary
                  description: The workbook file (.twb or .twbx).
      responses:
        '201':
          description: Workbook was published successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /sites/{site-id}/workbooks/{workbook-id}/tags:
    get:
      operationId: queryWorkbookTags
      summary: Query Workbook Tags
      description: >-
        Returns a list of tags that have been added to the specified workbook.
      tags:
        - Workbooks
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/WorkbookId'
      responses:
        '200':
          description: A list of tags on the workbook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'
    put:
      operationId: addTagsToWorkbook
      summary: Add Tags to Workbook
      description: >-
        Adds one or more tags to the specified workbook.
      tags:
        - Workbooks
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/WorkbookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagListRequest'
      responses:
        '200':
          description: Tags were added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'

  /sites/{site-id}/workbooks/{workbook-id}/tags/{tag-name}:
    delete:
      operationId: deleteTagFromWorkbook
      summary: Delete Tag from Workbook
      description: >-
        Deletes a tag from the specified workbook.
      tags:
        - Workbooks
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/WorkbookId'
        - name: tag-name
          in: path
          required: true
          schema:
            type: string
          description: The name of the tag to delete.
      responses:
        '204':
          description: Tag was deleted successfully.

  /sites/{site-id}/workbooks/{workbook-id}/revisions:
    get:
      operationId: getWorkbookRevisions
      summary: Get Workbook Revisions
      description: >-
        Returns a list of revision information (revision number, published
        date, and other metadata) for each revision of the specified workbook.
      tags:
        - Workbooks
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: A list of workbook revisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionListResponse'

  # ── Views ───────────────────────────────────────────────────

  /sites/{site-id}/views:
    get:
      operationId: queryViewsForSite
      summary: Query Views for Site
      description: >-
        Returns all the views for the specified site, optionally including
        usage statistics.
      tags:
        - Views
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Fields'
        - name: includeUsageStatistics
          in: query
          schema:
            type: boolean
            default: false
          description: If true, returns usage statistics for each view.
      responses:
        '200':
          description: A paginated list of views.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sites/{site-id}/views/{view-id}:
    get:
      operationId: queryViewById
      summary: Query View by ID
      description: >-
        Returns details about the specified view, including the view name,
        owner, project, and usage statistics.
      tags:
        - Views
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/ViewId'
      responses:
        '200':
          description: View details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{site-id}/views/{view-id}/image:
    get:
      operationId: queryViewImage
      summary: Query View Image
      description: >-
        Returns an image of the specified view rendered as a PNG file.
        You can specify the resolution of the image.
      tags:
        - Views
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/ViewId'
        - name: resolution
          in: query
          schema:
            type: string
            enum:
              - standard
              - high
            default: standard
          description: The resolution of the image (standard or high).
        - name: maxAge
          in: query
          schema:
            type: integer
            minimum: 1
          description: >-
            The maximum number of minutes a view image can be cached
            before being refreshed.
        - name: vf_<filter_name>
          in: query
          schema:
            type: string
          description: >-
            Apply a filter to the view. Replace <filter_name> with the
            name of the filter field.
      responses:
        '200':
          description: A PNG image of the view.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{site-id}/views/{view-id}/data:
    get:
      operationId: queryViewData
      summary: Query View Data
      description: >-
        Returns the data used in a view as a comma-separated values
        (CSV) file.
      tags:
        - Views
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/ViewId'
        - name: maxAge
          in: query
          schema:
            type: integer
            minimum: 1
          description: >-
            The maximum number of minutes a view can be cached
            before being refreshed.
        - name: vf_<filter_name>
          in: query
          schema:
            type: string
          description: >-
            Apply a filter to the view. Replace <filter_name> with the
            name of the filter field.
      responses:
        '200':
          description: CSV data for the view.
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{site-id}/views/{view-id}/pdf:
    get:
      operationId: queryViewPDF
      summary: Query View PDF
      description: >-
        Returns a PDF rendering of the specified view.
      tags:
        - Views
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/ViewId'
        - name: type
          in: query
          schema:
            type: string
            enum:
              - A3
              - A4
              - A5
              - B4
              - B5
              - Executive
              - Folio
              - Ledger
              - Legal
              - Letter
              - Note
              - Quarto
              - Tabloid
              - Unspecified
            default: Letter
          description: The paper size for the PDF.
        - name: orientation
          in: query
          schema:
            type: string
            enum:
              - portrait
              - landscape
            default: portrait
          description: The orientation of the PDF.
      responses:
        '200':
          description: A PDF rendering of the view.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{site-id}/views/{view-id}/previewImage:
    get:
      operationId: queryViewPreviewImage
      summary: Query View Preview Image
      description: >-
        Returns the thumbnail image for the specified view as a PNG file.
      tags:
        - Views
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/ViewId'
      responses:
        '200':
          description: A PNG preview image of the view.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{site-id}/views/{view-id}/recommendations:
    get:
      operationId: getRecommendationsForViews
      summary: Get Recommendations for Views
      description: >-
        Returns a list of views that are recommended for a user, based
        on their viewing history.
      tags:
        - Views
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/ViewId'
      responses:
        '200':
          description: A list of recommended views.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewListResponse'

  # ── Data Sources ────────────────────────────────────────────

  /sites/{site-id}/datasources:
    get:
      operationId: queryDataSources
      summary: Query Data Sources
      description: >-
        Returns a list of published data sources on the specified site,
        with optional pagination, filtering, and sorting.
      tags:
        - Data Sources
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: A paginated list of data sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sites/{site-id}/datasources/{datasource-id}:
    get:
      operationId: queryDataSource
      summary: Query Data Source
      description: >-
        Returns information about the specified data source.
      tags:
        - Data Sources
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/DataSourceId'
      responses:
        '200':
          description: Data source details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateDataSource
      summary: Update Data Source
      description: >-
        Updates the owner, project, or certification status of the
        specified data source.
      tags:
        - Data Sources
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/DataSourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDataSourceRequest'
      responses:
        '200':
          description: Data source was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteDataSource
      summary: Delete Data Source
      description: >-
        Deletes the specified data source from a site.
      tags:
        - Data Sources
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/DataSourceId'
      responses:
        '204':
          description: Data source was deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{site-id}/datasources/{datasource-id}/content:
    get:
      operationId: downloadDataSource
      summary: Download Data Source
      description: >-
        Downloads the specified data source in .tdsx format.
      tags:
        - Data Sources
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/DataSourceId'
        - name: includeExtract
          in: query
          schema:
            type: boolean
            default: true
          description: >-
            If true and the data source contains an extract, the
            download includes the extract.
      responses:
        '200':
          description: The data source file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{site-id}/datasources/{datasource-id}/connections:
    get:
      operationId: queryDataSourceConnections
      summary: Query Data Source Connections
      description: >-
        Returns a list of data connections for the specified data source.
      tags:
        - Data Sources
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/DataSourceId'
      responses:
        '200':
          description: A list of data connections for the data source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{site-id}/datasources/{datasource-id}/revisions:
    get:
      operationId: getDataSourceRevisions
      summary: Get Data Source Revisions
      description: >-
        Returns a list of revision information for each revision of
        the specified data source.
      tags:
        - Data Sources
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/DataSourceId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: A list of data source revisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionListResponse'

  /sites/{site-id}/datasources/{datasource-id}/tags:
    get:
      operationId: queryDataSourceTags
      summary: Query Data Source Tags
      description: >-
        Returns a list of tags associated with the specified data source.
      tags:
        - Data Sources
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/DataSourceId'
      responses:
        '200':
          description: A list of tags on the data source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'
    put:
      operationId: addTagsToDataSource
      summary: Add Tags to Data Source
      description: >-
        Adds one or more tags to the specified data source.
      tags:
        - Data Sources
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/DataSourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagListRequest'
      responses:
        '200':
          description: Tags were added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'

  # ── Users ───────────────────────────────────────────────────

  /sites/{site-id}/users:
    get:
      operationId: getUsers
      summary: Get Users on Site
      description: >-
        Returns the users associated with the specified site.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A paginated list of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
    post:
      operationId: addUserToSite
      summary: Add User to Site
      description: >-
        Adds a user to the specified site. The user must already exist
        on the server or in the identity store.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserRequest'
      responses:
        '201':
          description: User was added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /sites/{site-id}/users/{user-id}:
    get:
      operationId: queryUser
      summary: Query User on Site
      description: >-
        Returns information about the specified user on the site.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateUser
      summary: Update User
      description: >-
        Modifies information about the specified user.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    delete:
      operationId: removeUserFromSite
      summary: Remove User from Site
      description: >-
        Removes the specified user from the site.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: User was removed successfully.

  /sites/{site-id}/users/{user-id}/workbooks:
    get:
      operationId: queryWorkbooksForUser
      summary: Query Workbooks for User
      description: >-
        Returns the workbooks that the specified user owns or has
        Read (view) permissions for.
      tags:
        - Workbooks
        - Users
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: A paginated list of workbooks for the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbookListResponse'

  # ── Groups ──────────────────────────────────────────────────

  /sites/{site-id}/groups:
    get:
      operationId: queryGroups
      summary: Query Groups
      description: >-
        Returns a list of groups on the specified site.
      tags:
