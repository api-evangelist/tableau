naftiko: 1.0.0-alpha2
info:
  label: Tableau REST API — Sites
  description: 'Tableau REST API — Sites. 5 operations. Lead operation: Tableau Query Sites. Self-contained Naftiko capability
    covering one Tableau business surface.'
  tags:
  - Tableau
  - Sites
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TABLEAU_API_KEY: TABLEAU_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-sites
    baseUri: https://{server}/api/{api-version}
    description: Tableau REST API — Sites business capability. Self-contained, no shared references.
    resources:
    - name: sites
      path: /sites
      operations:
      - name: querysites
        method: GET
        description: Tableau Query Sites
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createsite
        method: POST
        description: Tableau Create Site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: sites-site-id
      path: /sites/{site-id}
      operations:
      - name: querysite
        method: GET
        description: Tableau Query Site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: includeUsageStatistics
          in: query
          type: boolean
          description: If true, returns usage statistics for the site.
      - name: updatesite
        method: PUT
        description: Tableau Update Site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletesite
        method: DELETE
        description: Tableau Delete Site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Tableau-Auth
      value: '{{env.TABLEAU_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: rest-sites-rest
    port: 8080
    description: REST adapter for Tableau REST API — Sites. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/sites
      name: sites
      description: REST surface for sites.
      operations:
      - method: GET
        name: querysites
        description: Tableau Query Sites
        call: rest-sites.querysites
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createsite
        description: Tableau Create Site
        call: rest-sites.createsite
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sites/{site-id}
      name: sites-site-id
      description: REST surface for sites-site-id.
      operations:
      - method: GET
        name: querysite
        description: Tableau Query Site
        call: rest-sites.querysite
        with:
          includeUsageStatistics: rest.includeUsageStatistics
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatesite
        description: Tableau Update Site
        call: rest-sites.updatesite
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletesite
        description: Tableau Delete Site
        call: rest-sites.deletesite
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-sites-mcp
    port: 9090
    transport: http
    description: MCP adapter for Tableau REST API — Sites. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: tableau-query-sites
      description: Tableau Query Sites
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-sites.querysites
      outputParameters:
      - type: object
        mapping: $.
    - name: tableau-create-site
      description: Tableau Create Site
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-sites.createsite
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: tableau-query-site
      description: Tableau Query Site
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-sites.querysite
      with:
        includeUsageStatistics: tools.includeUsageStatistics
      outputParameters:
      - type: object
        mapping: $.
    - name: tableau-update-site
      description: Tableau Update Site
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: rest-sites.updatesite
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: tableau-delete-site
      description: Tableau Delete Site
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: rest-sites.deletesite
      outputParameters:
      - type: object
        mapping: $.
