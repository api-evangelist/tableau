# ─────────────────────────────────────────────────────────────
# Extract / schedule types
# ─────────────────────────────────────────────────────────────

"""An extract (snapshot) for a data source or workbook."""
type Extract implements Node {
  id: ID!
  name: String!
  luid: String!
  encryptionState: String
  lastUpdateTime: DateTime
  lastRefreshTime: DateTime
  lastIncrementalUpdateTime: DateTime
  progress: Float
  datasource: PublishedDatasource
  jobs: [ExtractionJob!]!
}

"""A job that refreshes an extract."""
type ExtractionJob implements Node {
  id: ID!
  name: String!
  luid: String!
  type: ExtractRefreshType
  status: String
  priority: Int
  createdAt: DateTime
  startedAt: DateTime
  completedAt: DateTime
  extract: Extract
}

"""A recurring schedule for extract refreshes or flow runs."""
type Schedule implements Node {
  id: ID!
  name: String!
  luid: String!
  state: String
  type: String
  frequency: String
  nextRunAt: DateTime
  createdAt: DateTime
  updatedAt: DateTime
  datasources: [PublishedDatasource!]!
  workbooks: [Workbook!]!
  flows: [Flow!]!
}

# ─────────────────────────────────────────────────────────────
# Lineage helper types
# ─────────────────────────────────────────────────────────────

"""Column-level lineage mapping between upstream and downstream columns."""
type ColumnLineage {
  upstreamColumn: Column!
  downstreamField: Field!
  transformations: [String!]!
}

"""Table-level lineage mapping."""
type TableLineage {
  upstreamTable: DatabaseTable!
  downstreamDatasource: PublishedDatasource!
}

# ─────────────────────────────────────────────────────────────
# Connection info / VizQL lens types
# ─────────────────────────────────────────────────────────────

"""A Tableau Ask Data lens (natural-language query endpoint)."""
type Lens implements Node & Ownable & ProjectBound {
  id: ID!
  name: String!
  luid: String!
  description: String
  createdAt: DateTime
  updatedAt: DateTime
  owner: TableauUser
  project: Project
  datasource: PublishedDatasource
  includedFields: [Field!]!
}

"""A virtual connection (Tableau's shared connection layer)."""
type VirtualConnection implements Node & Ownable & ProjectBound {
  id: ID!
  name: String!
  luid: String!
  description: String
  isPublished: Boolean
  createdAt: DateTime
  updatedAt: DateTime
  owner: TableauUser
  project: Project
  tables: [VirtualConnectionTable!]!
  downstreamDatasources: [PublishedDatasource!]!
  downstreamWorkbooks: [Workbook!]!
}

"""A table exposed by a virtual connection."""
type VirtualConnectionTable implements Node {
  id: ID!
  name: String!
  luid: String!
  virtualConnection: VirtualConnection
  columns: [Column!]!
  downstreamDatasources: [PublishedDatasource!]!
}

# ─────────────────────────────────────────────────────────────
# Pagination helpers
# ─────────────────────────────────────────────────────────────

"""Pagination info for connection-style results."""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

"""A paginated edge for a Workbook node."""
type WorkbookEdge {
  node: Workbook!
  cursor: String!
}

"""A paginated connection for Workbook results."""
type WorkbookConnection {
  edges: [WorkbookEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"""A paginated edge for a PublishedDatasource node."""
type DatasourceEdge {
  node: PublishedDatasource!
  cursor: String!
}

"""A paginated connection for PublishedDatasource results."""
type DatasourceConnection {
  edges: [DatasourceEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# ─────────────────────────────────────────────────────────────
# Root query type
# ─────────────────────────────────────────────────────────────

type Query {
  """Retrieve a Tableau site by LUID."""
  tableauSite(luid: String!): TableauSite

  """List all projects on the site."""
  projectsConnection(
    filter: ProjectFilter
    orderBy: ProjectOrder
    first: Int
    after: String
  ): ProjectConnection

  """List all workbooks."""
  workbooksConnection(
    filter: WorkbookFilter
    orderBy: WorkbookOrder
    first: Int
    after: String
  ): WorkbookConnection

  """List all published data sources."""
  publishedDatasourcesConnection(
    filter: DatasourceFilter
    orderBy: DatasourceOrder
    first: Int
    after: String
  ): DatasourceConnection

  """List all flows."""
  flowsConnection(
    filter: FlowFilter
    first: Int
    after: String
  ): FlowConnection

  """List all metrics."""
  metricsConnection(
    first: Int
    after: String
  ): MetricConnection

  """List all database servers."""
  databaseServersConnection(
    filter: DatabaseServerFilter
    first: Int
    after: String
  ): DatabaseServerConnection

  """List all database tables."""
  databaseTablesConnection(
    filter: DatabaseTableFilter
    first: Int
    after: String
  ): DatabaseTableConnection

  """List all users."""
  usersConnection(
    filter: UserFilter
    first: Int
    after: String
  ): UserConnection

  """Retrieve any node by its global ID."""
  node(id: ID!): Node

  """Query column-level lineage for a given field."""
  columnLineage(fieldId: ID!): [ColumnLineage!]!

  """Query table-level lineage for a given datasource."""
  tableLineage(datasourceLuid: String!): [TableLineage!]!
}

# ─────────────────────────────────────────────────────────────
# Filter / order inputs
# ─────────────────────────────────────────────────────────────

input WorkbookFilter {
  name: StringFilter
  projectName: StringFilter
  updatedAt: DateFilter
  ownerLuid: String
  tagName: String
}

input DatasourceFilter {
  name: StringFilter
  projectName: StringFilter
  connectionType: StringFilter
  isCertified: Boolean
  hasExtracts: Boolean
  tagName: String
}

input ProjectFilter {
  name: StringFilter
  topLevelProject: Boolean
}

input FlowFilter {
  name: StringFilter
  projectName: StringFilter
}

input DatabaseServerFilter {
  name: StringFilter
  connectionType: StringFilter
  hostName: StringFilter
}

input DatabaseTableFilter {
  name: StringFilter
  schema: StringFilter
  connectionType: StringFilter
  isCertified: Boolean
}

input UserFilter {
  name: StringFilter
  siteRole: SiteRole
}

input StringFilter {
  eq: String
  contains: String
  startsWith: String
  endsWith: String
}

input DateFilter {
  gt: DateTime
  lt: DateTime
  gte: DateTime
  lte: DateTime
}

input WorkbookOrder {
  field: WorkbookOrderField!
  direction: OrderDirection!
}

enum WorkbookOrderField {
  name
  updatedAt
  createdAt
  projectName
  ownerName
}

input DatasourceOrder {
  field: DatasourceOrderField!
  direction: OrderDirection!
}

enum DatasourceOrderField {
  name
  updatedAt
  createdAt
  projectName
}

input ProjectOrder {
  field: ProjectOrderField!
  direction: OrderDirection!
}

enum ProjectOrderField {
  name
  updatedAt
}

# ─────────────────────────────────────────────────────────────
# Additional paginated connection types
# ─────────────────────────────────────────────────────────────

type ProjectConnection {
  edges: [ProjectEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ProjectEdge {
  node: Project!
  cursor: String!
}

