components:

  securitySchemes:
    TableauAuth:
      type: apiKey
      in: header
      name: X-Tableau-Auth
      description: >-
        The authentication token obtained from the Sign In method.
        Include this token in the X-Tableau-Auth header of all
        subsequent requests.

  parameters:
    SiteId:
      name: site-id
      in: path
      required: true
      schema:
        type: string
      description: >-
        The ID of the site. You can get the site ID from the response
        to the Sign In method.

    ProjectId:
      name: project-id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the project.

    WorkbookId:
      name: workbook-id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the workbook.

    ViewId:
      name: view-id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the view.

    DataSourceId:
      name: datasource-id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the data source.

    UserId:
      name: user-id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the user.

    GroupId:
      name: group-id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the group.

    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      description: >-
        The number of items to return in one response. The minimum is 1
        and the maximum is 1000.

    PageNumber:
      name: pageNumber
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: >-
        The page number of the set of items to return. The default is 1.

    Filter:
      name: filter
      in: query
      schema:
        type: string
      description: >-
        An expression that lets you specify a subset of items to return.
        Use the format filter=field:operator:value. Operators include
        eq, gt, gte, lt, lte, has, and in.

    Sort:
      name: sort
      in: query
      schema:
        type: string
      description: >-
        An expression that lets you specify the order in which items
        are returned. Use the format sort=field:direction where direction
        is asc or desc.

    Fields:
      name: fields
      in: query
      schema:
        type: string
      description: >-
        An expression that lets you specify which fields are included
        in the response. Use the format fields=field1,field2. Use
        _default_ to return the default set of fields, or _all_ to
        return all fields.

  responses:
    BadRequest:
      description: >-
        The request was malformed or contained invalid parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: >-
        The authentication credentials were missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: >-
        The caller does not have permission to perform the requested action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: >-
        The specified resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: >-
        A resource with the same name or identifier already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    # ── Error ──────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            summary:
              type: string
              description: A short summary of the error.
            detail:
              type: string
              description: A detailed description of the error.
            code:
              type: string
              description: A numeric error code.

    # ── Pagination ─────────────────────────────────────────────

          example: example_value
    Pagination:
      type: object
      properties:
        pageNumber:
          type: integer
          description: The current page number.
          example: 10
        pageSize:
          type: integer
          description: The number of items per page.
          example: 10
        totalAvailable:
          type: integer
          description: The total number of items available.

    # ── Authentication ─────────────────────────────────────────

          example: 10
    SignInRequest:
      type: object
      properties:
        credentials:
          type: object
          required:
          - site
          properties:
            name:
              type: string
              description: >-
                The name (user name) of the user signing in. Not required
                if using a personal access token.
            password:
              type: string
              format: password
              description: The password for the user.
            personalAccessTokenName:
              type: string
              description: >-
                The name of the personal access token. Use this instead
                of name and password for token-based authentication.
            personalAccessTokenSecret:
              type: string
              format: password
              description: The secret value of the personal access token.
            site:
              type: object
              properties:
                contentUrl:
                  type: string
                  description: >-
                    The URL namespace of the site. For the default site
                    on Tableau Server, use an empty string. For Tableau
                    Cloud, this is the site name in the URL.

          example: example_value
    SignInResponse:
      type: object
      properties:
        credentials:
