specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Tableau
providerId: tableau
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - Analytics
  - Business Intelligence
  - Dashboards
  - Data Visualization
  - Rate Limiting
description: Tableau Cloud applies per-site rate limits to specific REST API job-and-content
  operations. Limits are documented operationally as "calls per hour" / "calls per 24 hours" /
  "calls per minute" against a Tableau Cloud site rather than as raw requests-per-second; an
  additional VizQL Data Service allowance scales with Creator licenses on the site. Tableau
  Server installations do not enforce these per-site caps directly — they are governed by the
  underlying server capacity.
sources:
  - https://help.tableau.com/current/online/en-us/to_site_capacity.htm
responseCodes:
  throttled: 429
limits:
  - name: Extract Refresh Initiation
    scope: site
    metric: requests_per_hour
    limit: 60
    timeFrame: hour
    notes: Maximum REST API calls per Tableau Cloud site per one-hour period for initiating
      extract refreshes via REST API or related tooling.
  - name: Job Status / Cancel Queries
    scope: site
    metric: requests_per_day
    limit: 20000
    timeFrame: day
    notes: Maximum REST API calls per Tableau Cloud site per 24-hour period for querying job
      status or cancelling jobs.
  - name: Publish / Update Content
    scope: site
    metric: requests_per_hour
    limit: 600
    timeFrame: hour
    notes: 600 calls per hour (14,400 per 24-hour period) per site for publishing or updating
      workbooks and data sources.
  - name: Get Users on Site
    scope: site
    metric: requests_per_minute
    limit: 3000
    timeFrame: minute
  - name: Remove User from Site
    scope: site
    metric: requests_per_minute
    limit: 1600
    timeFrame: minute
  - name: VizQL Data Service Allowance
    scope: site
    metric: requests_per_hour
    limit: 100
    timeFrame: hour
    notes: An additional 100 calls per hour, per Creator license, on top of the standard caps —
      VizQL Data Service capacity scales with the number of Creators on the site.
policies:
  - name: 429 with Retry Guidance
    description: Exceeding a documented site cap returns HTTP 429 with retry guidance from the
      service. Clients should respect any retry signal and back off rather than retrying immediately.
  - name: Tableau Server Differentiation
    description: The published per-site numbers apply to Tableau Cloud. Self-hosted Tableau Server
      capacity is governed by underlying compute / VizQL session capacity rather than these
      site-level call ceilings.
  - name: Per-Site Scope
    description: Limits are scoped to a Tableau Cloud site, so multiple integrations sharing a
      site share the same hourly / daily ceiling.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
