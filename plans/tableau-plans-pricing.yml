specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Tableau
providerId: tableau
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Analytics
  - Business Intelligence
  - Dashboards
  - Data Visualization
description: Tableau (Salesforce) sells per-user role-based subscriptions for Tableau Cloud and
  Tableau Server. Public list pricing for the Cloud SKUs (Creator, Explorer, Viewer) is gated
  behind salesforce.com / tableau.com pricing pages that block automated fetches; published
  prices are well-known but were not directly verifiable from this run, so the artifact preserves
  the role tiers but defers price strings to the live pricing page.
sources:
  - https://www.tableau.com/pricing
  - https://www.tableau.com/pricing/teams-orgs
notes: Tableau pricing pages return 403 to automated fetchers. Plan tier names (Creator, Explorer,
  Viewer, Enterprise) are taken from the public Tableau pricing structure but exact monthly
  prices are not asserted here without direct page access. Reconciled left false until a live
  price string can be captured.
plans:
  - id: tableau-creator
    name: Tableau Creator
    type: subscription
    description: Per-user subscription for content creators who author workbooks, data sources,
      and data prep flows in Tableau Cloud or Tableau Server. Creator licenses gate authoring
      and the most expansive REST API surface.
    entries:
      - label: Per-User Subscription
        name: creator_seat
        type: subscription
        metric: seat
        limit: 1
        timeFrame: month
        geo: global
        unit: 1
        price: see https://www.tableau.com/pricing
        userMultiplied: true
    elements:
      - name: Web Authoring
      - name: Tableau Prep
      - name: Tableau Desktop
      - name: REST API Access
      - name: VizQL Data Service Access
  - id: tableau-explorer
    name: Tableau Explorer
    type: subscription
    description: Per-user subscription for users who explore and modify existing content but do
      not author from scratch.
    entries:
      - label: Per-User Subscription
        name: explorer_seat
        type: subscription
        metric: seat
        limit: 1
        timeFrame: month
        geo: global
        unit: 1
        price: see https://www.tableau.com/pricing
        userMultiplied: true
    elements:
      - name: Web Edit
      - name: Content Exploration
      - name: REST API Read Access
  - id: tableau-viewer
    name: Tableau Viewer
    type: subscription
    description: Per-user subscription for read-only consumers of dashboards and visualizations.
    entries:
      - label: Per-User Subscription
        name: viewer_seat
        type: subscription
        metric: seat
        limit: 1
        timeFrame: month
        geo: global
        unit: 1
        price: see https://www.tableau.com/pricing
        userMultiplied: true
    elements:
      - name: Dashboard Viewing
      - name: Subscriptions and Alerts
  - id: tableau-enterprise
    name: Tableau Enterprise
    type: enterprise
    description: Custom-quoted enterprise edition adding governance, advanced management, and
      additional add-ons such as Data Management and Advanced Management. Quoted directly by
      Tableau / Salesforce.
    entries:
      - label: Enterprise Subscription
        name: enterprise_subscription
        type: subscription
        metric: varies
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Data Management
      - name: Advanced Management
      - name: Tableau Pulse
      - name: Enterprise Support
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
