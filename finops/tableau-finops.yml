publisherName: Salesforce, Inc.
serviceCategory: Analytics & Business Intelligence
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Analytics
  - Business Intelligence
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps shape for Tableau Cloud / Tableau Server: per-user role-based
  subscriptions (Creator / Explorer / Viewer) plus enterprise add-ons. The site-level capacity
  caps documented in Tableau Cloud (extract refresh, publish, VizQL Data Service) are operational
  ceilings, not separately metered billing lines.'
sources:
  - https://www.tableau.com/pricing
  - https://help.tableau.com/current/online/en-us/to_site_capacity.htm
notes: Tableau pricing page is gated to automated fetchers; subscription tiers and FOCUS columns
  are reconciled but exact per-seat prices are not asserted here. Reconciled left false until
  a live price string can be captured.
billingModel:
  pricingCategory: Tiered Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Tableau
  ServiceCategory: Analytics & Business Intelligence
  ProviderName: Tableau
  PublisherName: Salesforce, Inc.
  InvoiceIssuerName: Salesforce, Inc.
  BillingCurrency: USD
  PricingUnit: seat-month
meters:
  - name: creator_seats
    unit: seat
    aggregation: max
    dimensions:
      - site
  - name: explorer_seats
    unit: seat
    aggregation: max
    dimensions:
      - site
  - name: viewer_seats
    unit: seat
    aggregation: max
    dimensions:
      - site
  - name: enterprise_addons
    unit: varies
    aggregation: max
    dimensions:
      - site
      - addon
principles:
  - name: Visibility
    description: Use the Tableau Cloud admin views and the REST API user-listing endpoints (with
      the documented 3000-calls-per-minute Get Users cap) to enumerate active seats per role,
      and reconcile against the Salesforce-issued Tableau invoice.
  - name: Allocation
    description: Allocate by Tableau Cloud site and by user role (Creator vs Explorer vs Viewer)
      so chargeback reflects the actual seat mix rather than a flat per-user blend.
  - name: Optimization
    description: Right-size the Creator / Explorer / Viewer mix at renewal, retire dormant seats,
      consolidate sites where governance allows, and respect the Cloud site-capacity limits to
      avoid 429-driven inefficiency in extract refresh and publish workflows.
  - name: Accountability
    description: The analytics or BI platform owner who holds the Tableau Cloud site is the
      accountable party for seat allocation and subscription renewal.
maintainers:
