naftiko: 1.0.0-alpha2
info:
  label: Tableau REST API — Authentication
  description: 'Tableau REST API — Authentication. 3 operations. Lead operation: Tableau Sign in. Self-contained Naftiko capability
    covering one Tableau business surface.'
  tags:
  - Tableau
  - Authentication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TABLEAU_API_KEY: TABLEAU_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-authentication
    baseUri: https://{server}/api/{api-version}
    description: Tableau REST API — Authentication business capability. Self-contained, no shared references.
    resources:
    - name: auth-signin
      path: /auth/signin
      operations:
      - name: signin
        method: POST
        description: Tableau Sign in
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: auth-signout
      path: /auth/signout
      operations:
      - name: signout
        method: POST
        description: Tableau Sign Out
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: auth-switchSite
      path: /auth/switchSite
      operations:
      - name: switchsite
        method: POST
        description: Tableau Switch Site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: X-Tableau-Auth
      value: '{{env.TABLEAU_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: rest-authentication-rest
    port: 8080
    description: REST adapter for Tableau REST API — Authentication. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/auth/signin
      name: auth-signin
      description: REST surface for auth-signin.
      operations:
      - method: POST
        name: signin
        description: Tableau Sign in
        call: rest-authentication.signin
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/auth/signout
      name: auth-signout
      description: REST surface for auth-signout.
      operations:
      - method: POST
        name: signout
        description: Tableau Sign Out
        call: rest-authentication.signout
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/auth/switchsite
      name: auth-switchsite
      description: REST surface for auth-switchSite.
      operations:
      - method: POST
        name: switchsite
        description: Tableau Switch Site
        call: rest-authentication.switchsite
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-authentication-mcp
    port: 9090
    transport: http
    description: MCP adapter for Tableau REST API — Authentication. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: tableau-sign
      description: Tableau Sign in
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-authentication.signin
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: tableau-sign-out
      description: Tableau Sign Out
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-authentication.signout
      outputParameters:
      - type: object
        mapping: $.
    - name: tableau-switch-site
      description: Tableau Switch Site
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-authentication.switchsite
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
